<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable | Abderahmane Thimbo</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f7; --ink: #1d1d1f; --ink-2: #48484d; --accent: #0058b9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f5f5f7; --ink-2: #a1a1a6; --accent: #2997ff; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
      .logo { font-weight: 600; font-size: 20px; color: var(--ink-2); }
      .logo b { color: var(--accent); }
      h1 { font-size: clamp(36px, 8vw, 64px); letter-spacing: -0.04em; line-height: 1.05; margin: 20px 0 12px; }
      p { color: var(--ink-2); margin-bottom: 28px; }
      a.btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #0071e3; color: #fff; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-label="Da7man">&lt;/<b>7</b>&gt;</div>
      <h1>Page introuvable</h1>
      <p>Cette adresse n'existe pas sur le portfolio d'Abderahmane Thimbo.</p>
      <a class="btn" href="/">Retour au portfolio</a>
    </main>
  </body>
</html>
